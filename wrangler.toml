name = "kekal-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret local-dev-only vars. NEVER put real secret values here.
# For local dev, prefer `.dev.vars` (gitignored) over editing this file.
[vars]
FRONTEND_REPO = "your-org/kekal-frontend"
FRONTEND_BRANCH = "main"
# Comma-separated list of allowed CORS origins (see index.ts fix below)
ALLOWED_ORIGINS = "http://localhost:5173"

# All five secrets below are set via:
#   wrangler secret put DATABASE_URL -e production
#   wrangler secret put JWT_SECRET -e production
#   wrangler secret put CLOUDINARY_URL -e production
#   wrangler secret put CHAPA_SECRET_KEY -e production
#   wrangler secret put GITHUB_TOKEN -e production
# Do not add them here.

[env.staging]
name = "kekal-backend-staging"
[env.staging.vars]
FRONTEND_REPO = "giftikabe/kekal-frontend"
FRONTEND_BRANCH = "staging"
ALLOWED_ORIGINS = "https://kekal-frontend-staging.pages.dev"

[env.production]
name = "kekal-backend-production"
[env.production.vars]
FRONTEND_REPO = "giftikabe/kekal-frontend"
FRONTEND_BRANCH = "main"
ALLOWED_ORIGINS = "https://kekal-frontend.pages.dev,https://kekalliving.com"